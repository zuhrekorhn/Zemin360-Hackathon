name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: PostgreSQL ve pgvector
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb zemin360

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Bağımlılıklar
        run: pip install -e ".[dev]"

      - name: Ortam (testler gerçek API anahtarı kullanmaz)
        run: |
          {
            echo "DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/zemin360"
            echo "JWT_GIZLI_ANAHTAR=ci-icin-yeterince-uzun-bir-gizli-anahtar-0123456789"
          } > .env

      - name: Lint ve biçim
        run: |
          ruff check .
          ruff format --check .

      - name: Migration'lar
        run: |
          alembic upgrade head
          alembic check

      - name: Testler
        run: pytest -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
