# Satış, operasyon, İK, finans, hukuk, sağlık: kamuya açık çıktısı olmayan işler.
# Bu meslekler için referans ve belge birincil yoldur; ceza değildir.
# Önerilen etiketler taslaktır; etiketi Zühre koyar.

- id: kapali-satis-referans
  alan: kamuya_kapali
  amac: Satış stajı; yöneticinin üç "evet"i Sonuç ve Rol'ü 3'e taşır, Kanıt "—".
  iddia:
    baslik: Kurumsal satış stajı
    aciklama: B2B yazılım firmasında satış ekibinde potansiyel müşteri listesini yeniden yapılandırdım.
    olculebilir_sonuc: Üç ayda 14 yeni toplantı ayarladım, ikisi sözleşmeye dönüştü.
    kendi_rolu: Müşteri listesini ve ilk temas e-postalarını ben hazırladım.
    is_turu: staj
  kart_yetenekleri: [Satış, CRM]
  referanslar:
    - {eposta: satis.muduru@yazilim-ornek.com.tr, iliski: yonetici, iddia_dogru: evet, pay_dogru: evet, sonuc_dogru: evet}
  kimlik: {ad: Yusuf Kara, eposta: yusuf.kara@ornek.com, eposta_dogrulandi: true}
  onerilen: {kanit: null, sonuc: 3, rol: 3, referans: 3}

- id: kapali-finans-beyan
  alan: kamuya_kapali
  amac: Finans stajı, yalnızca beyan; sonuç sayısal (2), rol belirsiz (1).
  iddia:
    baslik: Muhasebe stajı
    aciklama: Bir muhasebe bürosunda aylık beyanname hazırlığına destek verdim.
    olculebilir_sonuc: Ayda yaklaşık 30 firmanın evrakı hazırlandı.
    kendi_rolu: Ekibe yardımcı oldum.
    is_turu: staj
  kart_yetenekleri: [Muhasebe, Excel]
  kimlik: {ad: Esra Bulut, eposta: esra.bulut@ornek.com}
  onerilen: {kanit: null, sonuc: 2, rol: 1, referans: null}

- id: kapali-ik-iki-referans
