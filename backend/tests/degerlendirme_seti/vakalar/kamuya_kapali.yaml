    baslik: İşe alım süreci stajı
    aciklama: İK departmanında stajyer işe alım sürecinin ön elemesini düzenledim.
    olculebilir_sonuc: Ön eleme süresi başvuru başına 20 dakikadan 8 dakikaya indi.
    kendi_rolu: Ön eleme formunu ve puanlama tablosunu ben hazırladım.
