[project]
name = "zemin360-backend"
version = "0.1.0"
description = "Zemin360 — 6 uzman AI ajanının ortak veri katmanı üzerinde çalıştığı platformun backend'i"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "email-validator>=2.0",  # schemas/kesif.py EmailStr
    "httpx>=0.27",
    # Ajan orkestrasyonu (docs/architecture.md § Orkestrasyon)
    "langgraph>=0.2",
    "langchain-google-genai>=2.0",
    # LangGraph checkpointer aynı Postgres'i kullanır, ama psycopg sürücüsüyle —
    # asyncpg'yi desteklemiyor. Uygulama verisi hâlâ asyncpg üzerinden okunur.
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.2",
    # Kimlik (docs/faz-b-kimlik-ve-dongu.md § 1): şifre hash'i ve JWT
    "argon2-cffi>=23.1",
    "PyJWT>=2.8",
    # Dosya ve görsel kanıtı (docs/plans/dogrulama-iyilestirme.md § 4)
    "python-multipart>=0.0.9",  # yükleme ucu
    "boto3>=1.34",  # Cloudflare R2 (S3 uyumlu)
    "filetype>=1.2",  # tür ilk baytlardan
    "pikepdf>=9.0",  # PDF temizliği (JavaScript, gömülü dosya)
    "pillow>=11.0",  # görselin yeniden kodlanması, EXIF
    "pillow-heif>=0.18",  # HEIC
    "pypdf>=5.0",  # PDF metni
    "pypdfium2>=4.30",  # PDF sayfası → görüntü (QR)
    "zxing-cpp>=2.2",  # QR / barkod
    "pyhanko>=0.25",  # e-imza (PAdES)
    "c2pa-python>=0.6",  # içerik kimlik bilgisi
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.6",
    # Doğrulama değerlendirme seti: vaka dosyaları (degerlendirme/vaka.py)
    "pyyaml>=6.0",
]
# Yedek okuyucu servisi (backend/yedek_okuyucu/, ayrı süreç: python -m yedek_okuyucu)
yedek-okuyucu = [
    "playwright>=1.48",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]  # autogenerate çıktısı

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI'nin standart kalıbı: bağımlılıklar argüman varsayılanında Depends() ile verilir.
"app/api/*.py" = ["B008"]
# Testlerdeki küçük uygulamalar da aynı kalıbı kullanıyor.
"tests/*.py" = ["B008"]

[tool.ruff.lint.isort]
# Yerel alembic/ klasörü ile PyPI paketi karışmasın
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
